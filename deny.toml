# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any RustSec advisory, including unmaintained crates.
yanked = "deny"

[licenses]
# Allowed licenses may not all be in use yet; that is fine.
unused-allowed-license = "allow"
# Licenses compatible with distributing TabExtend under GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
