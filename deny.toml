# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any RustSec advisory, including unmaintained crates.
yanked = "deny"
ignore = [
    # zbus 5's helper crates, merged into zbus 6 rather than abandoned; no
    # security issue. They come in through ashpd 0.13, which still uses
    # zbus 5. Remove these when ashpd moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via ashpd" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via ashpd" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via ashpd" },
]

[licenses]
# Allowed licenses may not all be in use yet; that is fine.
unused-allowed-license = "allow"
# Licenses compatible with distributing TabExtend under GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
