[package]
name = "tabextend-app"
description = "TabExtend desktop app: use an Android tablet as a wireless extended monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tabextend-app"
path = "src/main.rs"

[dependencies]
tabextend-core = { path = "../core", version = "0.1.0" }
tabextend-host = { path = "../host", version = "0.1.0" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
