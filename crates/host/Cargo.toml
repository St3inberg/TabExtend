[package]
name = "tabextend-host"
description = "TabExtend host: turns an Android tablet into an extended monitor for GNOME on Wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tabextend"
path = "src/main.rs"

[dependencies]
tabextend-core = { path = "../core", version = "0.1.0" }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
getrandom = "0.4"
gstreamer = { version = "0.25", features = ["v1_20"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
zbus = "5"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
